# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# CI runs `cargo deny check`; locally: `cargo deny check` (needs network for
# the advisory database and the crates.io index).

[graph]
# Only the platforms we build for; Windows/Android-only crates in the lock
# file are not part of the checked graph.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2026-0007", reason = "bytes 1.9.0 BytesMut::reserve overflow; fixed by the dependency bump in cleanup/07-deps" },
    { id = "RUSTSEC-2025-0009", reason = "ring 0.17.8 AES panic with overflow checks; fixed by the dependency bump in cleanup/07-deps" },
]

[licenses]
version = 2
confidence-threshold = 0.8
# Every license in the current graph (`cargo deny --all-features list`).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
]
# `nsm` itself carries no license field yet (`publish = false`; choosing a
# LICENSE is on the maintainer's list in docs/PLAN.md section 2).
private = { ignore = true }

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
