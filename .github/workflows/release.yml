name: Release

# On a version tag: build the binaries for every platform (the Binaries
# workflow, .github/workflows/binaries.yml), pack the vendored source tree for
# air-gapped builds, push the container image to GHCR, and publish a GitHub
# release with everything attached.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: "true"

jobs:
  binaries:
    # One tarball and checksum per platform, as artifacts `nsm-<platform>`;
    # the binaries workflow runs each binary where it can run and checks the
    # tag against Cargo.toml's version. Its dev-release job (skipped on a
    # tag) asks for contents: write, which a called workflow may only be
    # granted, not take, so the grant is here.
    name: binaries
    uses: ./.github/workflows/binaries.yml
    permissions:
      contents: write

  vendored-source:
    name: vendored source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The tracked vendor/ directory must match Cargo.lock; an offline build
      # from the tarball proves it.
      - run: cargo build --release --locked --offline
      - name: Package
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          name="nsm-${version}-src-vendored"
          git archive --format=tar --prefix="$name/" HEAD | gzip -9 > "$name.tar.gz"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: nsm-src-vendored
          path: |
            nsm-*-src-vendored.tar.gz
            nsm-*-src-vendored.tar.gz.sha256

  image:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub release
    needs: [binaries, vendored-source, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the changelog
        run: |
          # The section for this version, or the Unreleased section as a fallback.
          version=${GITHUB_REF_NAME#v}
          section() { awk -v h="$1" '/^## \[/ { p = (index($0, h) > 0); next } p' CHANGELOG.md; }
          section "[$version]" > notes.md
          [ -s notes.md ] || section "[Unreleased]" > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
