name: Release

# On a version tag: build release binaries (static musl with the pure-Rust
# `ring` provider, glibc and macOS with `aws-lc-rs`), pack the vendored source
# tree for air-gapped builds, push the container image to GHCR, and publish a
# GitHub release with everything attached.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: "true"

jobs:
  binaries:
    name: ${{ matrix.target }} (${{ matrix.provider }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,      target: x86_64-unknown-linux-musl,  provider: ring,      musl: true }
          - { os: ubuntu-24.04-arm,   target: aarch64-unknown-linux-musl, provider: ring,      musl: true }
          - { os: ubuntu-latest,      target: x86_64-unknown-linux-gnu,   provider: aws-lc-rs, musl: false }
          - { os: ubuntu-24.04-arm,   target: aarch64-unknown-linux-gnu,  provider: aws-lc-rs, musl: false }
          - { os: macos-latest,       target: aarch64-apple-darwin,       provider: aws-lc-rs, musl: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} --no-default-features --features ${{ matrix.provider }}
      - name: Package
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          name="nsm-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/nsm" README.md CHANGELOG.md "dist/$name/"
          cp -R docs "dist/$name/docs"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          "dist/$name/nsm" --version
      - uses: actions/upload-artifact@v4
        with:
          name: nsm-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  vendored-source:
    name: vendored source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The tracked vendor/ directory must match Cargo.lock; an offline build
      # from the tarball proves it.
      - run: cargo build --release --locked --offline
      - name: Package
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          name="nsm-${version}-src-vendored"
          git archive --format=tar --prefix="$name/" HEAD | gzip -9 > "$name.tar.gz"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: nsm-src-vendored
          path: |
            nsm-*-src-vendored.tar.gz
            nsm-*-src-vendored.tar.gz.sha256

  image:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub release
    needs: [binaries, vendored-source, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the changelog
        run: |
          # The section for this version, or the Unreleased section as a fallback.
          version=${GITHUB_REF_NAME#v}
          section() { awk -v h="$1" '/^## \[/ { p = (index($0, h) > 0); next } p' CHANGELOG.md; }
          section "[$version]" > notes.md
          [ -s notes.md ] || section "[Unreleased]" > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
