name: Docs

# Builds `cargo doc` and publishes it to GitHub Pages. The repository's Pages
# source must be set to "GitHub Actions" (Settings > Pages) for the deploy step
# to take effect; until then this workflow only verifies that the docs build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps
      - name: Add landing page
        run: |
          {
            echo '<!doctype html><meta charset="utf-8"><title>nsm documentation</title>'
            echo '<h1>nsm documentation</h1><ul>'
            for d in target/doc/*/; do
              n=$(basename "$d")
              [ -f "$d/index.html" ] && echo "<li><a href=\"$n/index.html\">$n</a></li>"
            done
            echo '</ul>'
          } > target/doc/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
