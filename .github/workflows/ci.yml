name: CI

on:
  push:
    branches: [main, "cleanup/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Dependencies are vendored and .cargo/config.toml replaces crates.io with
  # vendor/, so every cargo invocation runs offline against Cargo.lock.
  CARGO_NET_OFFLINE: "true"

jobs:
  build-test:
    name: build and test (${{ matrix.os }}, ${{ matrix.provider }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        provider: [aws-lc-rs, ring]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.provider }}
      - run: cargo build --locked --all-targets --no-default-features --features ${{ matrix.provider }}
      - run: cargo test --locked --all-targets --no-default-features --features ${{ matrix.provider }}
      - run: cargo test --locked --doc --no-default-features --features ${{ matrix.provider }}

  lint:
    name: fmt, clippy and rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # src/legacy is excluded from formatting (#[rustfmt::skip]) and from
      # lints (#[allow(warnings, clippy::all)]) until it is deleted.
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features --features ring -- -D warnings
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
