name: Binaries

# Builds the `nsm` binary for every platform a release ships, runs each one
# where it can run, and uploads one tarball per platform (the binary, README,
# changelog, license and docs/, packed by scripts/package.sh) with its SHA-256
# sum as the artifact `nsm-<platform>`. The release workflow calls this one on
# a version tag and attaches the tarballs to the release; on its own it runs
# on every push to main, on a pull request that changes the build recipe, and
# on demand.
#
#   platform (tarball suffix)            built with                 provider   runs on
#   x86_64-unknown-linux-gnu             manylinux_2_28, gcc 14     aws-lc-rs  Linux, glibc 2.28 or newer
#   aarch64-unknown-linux-gnu            manylinux_2_28, gcc 14     aws-lc-rs  Linux, glibc 2.28 or newer
#   x86_64-unknown-linux-gnu-glibc2.17   zig, through cargo-zigbuild  ring     Linux, glibc 2.17 or newer
#   aarch64-unknown-linux-gnu-glibc2.17  zig, through cargo-zigbuild  ring     Linux, glibc 2.17 or newer
#   x86_64-unknown-linux-musl            musl-tools                 ring       any Linux (static)
#   aarch64-unknown-linux-musl           musl-tools                 ring       any Linux (static)
#   x86_64-apple-darwin                  macos-15-intel             aws-lc-rs  macOS 10.12 or newer, Intel
#   aarch64-apple-darwin                 macos-latest               aws-lc-rs  macOS 11 or newer, Apple silicon
#   x86_64-unknown-freebsd               clang, FreeBSD 14 sysroot  ring       FreeBSD 14 or newer
#
# glibc 2.28 is the floor of RHEL 8, Ubuntu 20.04, Debian 10 and SLES 15 SP3;
# glibc 2.17 (RHEL and CentOS 7) is the oldest Rust itself supports. The
# default provider, aws-lc-rs, is built where a platform's own C toolchain
# builds it; the pure-Rust ring provider serves the static, the legacy-glibc
# and the cross-compiled builds (Cargo.toml, [features]).

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/binaries.yml
      - scripts/package.sh
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - vendor/**

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Dependencies are vendored and .cargo/config.toml replaces crates.io with
  # vendor/, so every cargo invocation runs offline against Cargo.lock.
  CARGO_NET_OFFLINE: "true"

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        # The version in the tarball names: on a tag the tag's, which must be
        # Cargo.toml's (the binary reports that one); elsewhere Cargo.toml's
        # with the commit.
        run: |
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          case "$GITHUB_REF" in
            refs/tags/v*)
              version=${GITHUB_REF_NAME#v}
              if [ "$version" != "$cargo" ]; then
                echo "::error::tag $GITHUB_REF_NAME names version $version, Cargo.toml says $cargo"
                exit 1
              fi ;;
            *)
              version="$cargo-dev.$(git rev-parse --short=8 HEAD)" ;;
          esac
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"

  linux-gnu:
    name: ${{ matrix.target }} (aws-lc-rs, glibc 2.28)
    needs: version
    runs-on: ${{ matrix.os }}
    # AlmaLinux 8 with gcc 14 (the manylinux_2_28 image), so the binary needs
    # glibc 2.28 or newer whatever the runner's own glibc is.
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    arch: x86_64,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, arch: aarch64, target: aarch64-unknown-linux-gnu }
    env:
      GLIBC_FLOOR: "2.28"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the glibc floor and run the binary
        run: |
          bin=target/${{ matrix.target }}/release/nsm
          needs=$(readelf -V "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "needs glibc $needs, floor $GLIBC_FLOOR"
          test "$(printf '%s\n%s\n' "$needs" "$GLIBC_FLOOR" | sort -V | tail -1)" = "$GLIBC_FLOOR"
          "$bin" --version
          "$bin" list-interfaces
          "$bin" list-ips --ip-version 4
      - run: scripts/package.sh ${{ matrix.target }} ${{ needs.version.outputs.version }} target/${{ matrix.target }}/release/nsm
      - uses: actions/upload-artifact@v7
        with:
          name: nsm-${{ matrix.target }}
          path: dist/*

  linux-gnu-legacy:
    name: ${{ matrix.target }} (ring, glibc 2.17)
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    arch: x86_64,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, arch: aarch64, target: aarch64-unknown-linux-gnu }
    env:
      GLIBC_FLOOR: "2.17"
      # Bump the two together, after a local build and the CentOS 7 run below.
      CARGO_ZIGBUILD: "0.23.4"
      ZIG: "0.16.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-glibc2.17
      # zig links against glibc stubs of the version named in the target
      # (`<triple>.2.17`) and brings its own C compiler, so the result needs
      # nothing newer than CentOS 7 ships; the pure-Rust provider keeps the C
      # side down to ring's own sources. Both come from PyPI into one virtual
      # environment, whose bin directory leads PATH so that cargo-zigbuild
      # finds zig as `python3 -m ziglang`.
      - name: Install cargo-zigbuild and zig
        run: |
          python3 -m venv "$HOME/zig"
          "$HOME/zig/bin/pip" install "cargo-zigbuild==$CARGO_ZIGBUILD" "ziglang==$ZIG"
          echo "$HOME/zig/bin" >> "$GITHUB_PATH"
      - run: cargo-zigbuild --version && python3 -m ziglang version
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }}.2.17 --no-default-features --features ring
      - name: Check the glibc floor
        run: |
          bin=target/${{ matrix.target }}/release/nsm
          needs=$(readelf -V "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "needs glibc $needs, floor $GLIBC_FLOOR"
          test "$(printf '%s\n%s\n' "$needs" "$GLIBC_FLOOR" | sort -V | tail -1)" = "$GLIBC_FLOOR"
      # CentOS 7 (glibc 2.17) is what the manylinux2014 image is; quay.io has
      # no pull limit for anonymous runners.
      - name: Run the binary on CentOS 7
        run: |
          docker run --rm -v "$PWD/target/${{ matrix.target }}/release:/nsm:ro" \
            quay.io/pypa/manylinux2014_${{ matrix.arch }} \
            sh -c 'ldd --version | head -1 && /nsm/nsm --version && /nsm/nsm list-interfaces && /nsm/nsm list-ips --ip-version 4'
      - run: scripts/package.sh ${{ matrix.target }}-glibc2.17 ${{ needs.version.outputs.version }} target/${{ matrix.target }}/release/nsm
      - uses: actions/upload-artifact@v7
        with:
          name: nsm-${{ matrix.target }}-glibc2.17
          path: dist/*

  linux-musl:
    name: ${{ matrix.target }} (ring, static)
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} --no-default-features --features ring
      - name: Check that the binary is static and run it
        run: |
          bin=target/${{ matrix.target }}/release/nsm
          file "$bin"
          file "$bin" | grep -Eq 'static(ally|-pie) linked'
          "$bin" --version
          "$bin" list-interfaces
          "$bin" list-ips --ip-version 4
      - run: scripts/package.sh ${{ matrix.target }} ${{ needs.version.outputs.version }} target/${{ matrix.target }}/release/nsm
      - uses: actions/upload-artifact@v7
        with:
          name: nsm-${{ matrix.target }}
          path: dist/*

  macos:
    name: ${{ matrix.target }} (aws-lc-rs)
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Intel build on an Intel runner, so that it is also run where
          # it is meant to run; macos-15-intel is the current Intel image.
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest,   target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Show the minimum macOS version and run the binary
        run: |
          bin=target/${{ matrix.target }}/release/nsm
          vtool -show-build "$bin"
          "$bin" --version
          "$bin" list-interfaces
          "$bin" list-ips --ip-version 4
      - run: scripts/package.sh ${{ matrix.target }} ${{ needs.version.outputs.version }} target/${{ matrix.target }}/release/nsm
      - uses: actions/upload-artifact@v7
        with:
          name: nsm-${{ matrix.target }}
          path: dist/*

  freebsd:
    name: x86_64-unknown-freebsd (ring, FreeBSD 14)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-freebsd
      # clang with a sysroot from the newest FreeBSD 14 release, so the binary
      # runs on FreeBSD 14 and later; the next job proves it.
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: x86_64-unknown-freebsd@14
      - run: cargo build --release --locked --target x86_64-unknown-freebsd --no-default-features --features ring
      - run: file target/x86_64-unknown-freebsd/release/nsm
      - run: scripts/package.sh x86_64-unknown-freebsd ${{ needs.version.outputs.version }} target/x86_64-unknown-freebsd/release/nsm
      - uses: actions/upload-artifact@v7
        with:
          name: nsm-x86_64-unknown-freebsd
          path: dist/*

  freebsd-run:
    name: x86_64-unknown-freebsd runs on FreeBSD 14
    needs: freebsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nsm-x86_64-unknown-freebsd
          path: dist
      # A FreeBSD virtual machine (the newest 14.x release) on the runner, with
      # the workspace, here only the tarball, copied in.
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          run: |
            set -eu
            freebsd-version
            cd dist
            tar -xzf nsm-*-x86_64-unknown-freebsd.tar.gz
            cd nsm-*-x86_64-unknown-freebsd
            ./nsm --version
            ./nsm list-interfaces
            ./nsm list-ips --ip-version 4
