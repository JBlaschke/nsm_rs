# Runs one NSM broker (HTTP transport) on port 12000.
#
#   docker compose up --build
#
# For TLS, uncomment the `environment`, `volumes` and `command` blocks and put
# cert.pem / key.pem into ./certs.
services:
  broker:
    build:
      context: .
      target: final
      args:
        APP_NAME: api
    ports:
      - "12000:12000"
    environment:
      NSM_LOG_LEVEL: info
      NSM_LOG_STYLE: never
      # CERT_PATH: /certs/cert.pem
      # KEY_PATH: /certs/key.pem
    # volumes:
    #   - ./certs:/certs:ro
    # command: ["listen", "-n", "eth0", "--ip-version", "4", "--bind-port", "12000", "--tls"]
