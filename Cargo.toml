[package]
name = "nsm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "NERSC Service Mesh: an HPC-aware connection broker that pairs published services with claiming clients"
repository = "https://github.com/JBlaschke/nsm_rs"
readme = "README.md"
keywords = ["hpc", "service-mesh", "broker", "networking"]
categories = ["network-programming", "command-line-utilities"]
license = "BSD-3-Clause"
# Built and deployed from this repository, not published to crates.io.
publish = false

[lib]
name = "nsm"
path = "src/lib.rs"

[[bin]]
name = "nsm"
path = "src/main.rs"

[features]
# Exactly one rustls crypto provider should be enabled. `aws-lc-rs` is the
# rustls default and FIPS-capable but needs a C toolchain (and cmake on some
# targets); `ring` is pure Rust and the right choice for static musl builds:
#   cargo build --no-default-features --features ring
default = ["aws-lc-rs"]
aws-lc-rs = ["rustls/aws_lc_rs", "tokio-rustls/aws_lc_rs"]
ring = ["rustls/ring", "tokio-rustls/ring"]

[dependencies]
# CLI, logging, errors
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Networking
if-addrs = "0.15"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "tracing"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "service"] }

# TLS (provider selected by the features above; defaults disabled on purpose)
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging"] }
rustls-native-certs = "0.8"  # platform trust store fallback in src/tls.rs

[profile.release]
# Wire-controlled integers must never wrap silently (audit S31).
overflow-checks = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
tempfile = "3"
