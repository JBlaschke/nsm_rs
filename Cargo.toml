[package]
name = "nsm"
version = "0.1.0"
edition = "2021"
description = "NERSC Service Mesh: an HPC-aware connection broker that pairs published services with claiming clients"
repository = "https://github.com/JBlaschke/nsm_rs"
readme = "README.md"
keywords = ["hpc", "service-mesh", "broker", "networking"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
clap = "4.5.4"
env_logger = "0.11.3"
log = "0.4.21"
pnet = "0.33.0"
serde = {version = "1.0.159", features = ["derive"]}
serde_json = "1.0.95"
lazy_static = "1.4.0"
tokio = { version = "1", features = ["full"] }
hyper = "1.4.1"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
pki-types = { package = "rustls-pki-types", version = "1" }
rustls-native-certs = "0.8"
hyper-rustls = "0.27.3"
rustls = { version = "0.23", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
url = "2.5.2"
rustls-pemfile = "2"
base64 = "0.22.1"


[features]
ring = []
aws-lc-rs = []


[[bin]]
name = "tcp"
path = "src/tcp.rs"

[[bin]]
name = "api"
path = "src/api.rs"
